name: "MKGiK timetable parser hotfix deploy"

on:
  push:
    branches: ["feat/shared-week-cache"]
    paths:
      - "worker/src/source.mjs"
      - "worker/src/core.mjs"
      - "worker/src/scheduler.mjs"
      - "worker/test/**"
      - "scripts/deploy-parser-hotfix.mjs"
      - ".github/workflows/worker-parser-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mkgik-timetable-parser-hotfix
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned dependencies
        working-directory: worker
        run: npm ci
      - name: Run Worker parser and D1 regression suite
        working-directory: worker
        run: npm test
      - name: Validate Worker source
        working-directory: worker
        run: npm run check
      - name: Verify deployment bundle
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir /tmp/mkgik-worker-hotfix
      - name: Deploy parser fix to existing active Worker and verify real source + Telegram delivery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FREE_PLAN_CONFIRMED: ${{ vars.FREE_PLAN_CONFIRMED }}
        run: node scripts/deploy-parser-hotfix.mjs
