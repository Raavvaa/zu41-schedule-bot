name: "Accountant reviewed update"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brat-accountant-deploy
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    if: github.ref == 'refs/heads/deploy/brat-accountant' || github.ref == 'refs/heads/prepare/accountant-fallback-release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTHORIZED_SOURCE_SHA: fe421ea9efbb1d4b17671655f59a602f8c845fd8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-control
      - uses: actions/checkout@v4
        with:
          ref: fe421ea9efbb1d4b17671655f59a602f8c845fd8
          path: reviewed-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix reviewed-source/accountant
      - name: Syntax and isolated regression tests
        run: |
          npm run check --prefix reviewed-source/accountant
          npm test --prefix reviewed-source/accountant
          node --test release-control/accountant/test/release-update.test.mjs
      - name: Verify OpenRouter with synthetic data
        id: openrouter
        continue-on-error: true
        env:
          CHAT_PROVIDER: openrouter
          OPENROUTER_MODEL: openrouter/free
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node reviewed-source/accountant/test/conversation-live.mjs --primary
      - name: Verify Groq fallback with a simulated OpenRouter outage
        id: groq
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node reviewed-source/accountant/test/conversation-live.mjs --fallback
      - name: Probe optional Workers AI chat reserve on confirmed Free plan
        id: workers_ai
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FREE_PLAN_CONFIRMED: ${{ vars.FREE_PLAN_CONFIRMED }}
        run: node reviewed-source/accountant/test/workers-ai-live.mjs
      - name: Require at least one live model to pass
        env:
          OPENROUTER_OUTCOME: ${{ steps.openrouter.outcome }}
          GROQ_OUTCOME: ${{ steps.groq.outcome }}
        run: test "$OPENROUTER_OUTCOME" = success || test "$GROQ_OUTCOME" = success
      - name: Update existing accountant and verify health and owner delivery
        if: github.ref == 'refs/heads/deploy/brat-accountant'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.SABUNCHI_BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FREE_PLAN_CONFIRMED: ${{ vars.FREE_PLAN_CONFIRMED }}
          AI_RESERVE_VERIFIED: ${{ steps.workers_ai.outcome == 'success' }}
        run: node release-control/accountant/release-update.mjs reviewed-source
