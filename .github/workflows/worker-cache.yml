name: Accountant live replay verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brat-accountant-deploy
  cancel-in-progress: false
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9a04d3c648cf4a4214265be466d2fea6dce4d78e
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix accountant
      - run: npm test --prefix accountant
      - name: Verify live reply without financial changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          EXPECTED_SHA: 29566ff46f4dc58cba891104ea066c5a0169c952
        run: node accountant/verify-conversation.mjs
