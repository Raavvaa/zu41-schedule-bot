name: "Verify private Brat accountant"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brat-accountant-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/brat-accountant
      - name: Verify private Telegram and Cron
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.SABUNCHI_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OWNER_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          FREE_PLAN_CONFIRMED: ${{ vars.FREE_PLAN_CONFIRMED }}
        run: node accountant/verify.mjs
