name: "Panda isolated deployment"
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'deploy or read-only diagnose'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - diagnose
permissions:
  contents: read
concurrency:
  group: panda-personal-agent-deploy
  cancel-in-progress: false
jobs:
  panda:
    if: github.ref == 'refs/heads/feat/panda-agent-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only Panda diagnostics
        if: inputs.operation == 'diagnose'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PANDA_BOT_TOKEN: ${{ secrets.PANDA_REPLACEMENT_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node panda/diagnose.mjs
      - run: npm ci --prefix panda
        if: inputs.operation != 'diagnose'
      - name: Syntax and isolated behavior tests
        if: inputs.operation != 'diagnose'
        run: |
          npm run check --prefix panda
          npm test --prefix panda
      - name: Bounded live model checks with fictional data
        if: inputs.operation != 'diagnose'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run live --prefix panda
      - name: Deploy only Panda and verify server plus owner delivery
        if: inputs.operation != 'diagnose'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PANDA_BOT_TOKEN: ${{ secrets.PANDA_REPLACEMENT_BOT_TOKEN }}
          EXPECTED_PANDA_BOT_ID: '8976655600'
          PREVIOUS_PANDA_BOT_TOKEN: ${{ secrets.PANDA_BOT_TOKEN }}
          EXPECTED_PREVIOUS_PANDA_BOT_ID: '9235352888'
          OWNER_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FREE_PLAN_CONFIRMED: ${{ vars.FREE_PLAN_CONFIRMED }}
        run: node panda/deploy.mjs
