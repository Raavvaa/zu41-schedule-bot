name: Accountant live conversation verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brat-accountant-deploy
  cancel-in-progress: false
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0ac35855b81de63d54c47584980830e94ee18923
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live conversation and queue metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OWNER_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          EXPECTED_SHA: ee0da7a3d379edcf27091cc50a916f84465ac905
        run: node accountant/verify-conversation.mjs
