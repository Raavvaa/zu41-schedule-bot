name: "Deploy private Brat accountant"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brat-accountant-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b685e24a7d931204864eda9d8d4d27d35ada44cc
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned accountant dependencies
        working-directory: accountant
        run: npm ci
      - name: Verify private access, ledger and delivery recovery
        working-directory: accountant
        run: |
          npm run check
          npm test
      - name: Deploy isolated accountant and verify Groq and Telegram
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.SABUNCHI_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OWNER_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          FREE_PLAN_CONFIRMED: ${{ vars.FREE_PLAN_CONFIRMED }}
        run: node accountant/deploy.mjs
