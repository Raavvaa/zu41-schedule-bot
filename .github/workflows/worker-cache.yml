name: "Panda isolated deployment"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: panda-personal-agent-deploy
  cancel-in-progress: false
jobs:
  panda:
    if: github.ref == 'refs/heads/feat/panda-agent-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix panda
      - name: Syntax and isolated behavior tests
        run: |
          npm run check --prefix panda
          npm test --prefix panda
      - name: Bounded live model checks with fictional data
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npm run live --prefix panda
      - name: Deploy only Panda and verify server plus owner delivery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PANDA_BOT_TOKEN: ${{ secrets.PANDA_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FREE_PLAN_CONFIRMED: ${{ vars.FREE_PLAN_CONFIRMED }}
        run: node panda/deploy.mjs
